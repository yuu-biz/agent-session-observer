name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target; the other two guard the path handling
        # and timezone assumptions that differ per platform.
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  timezones:
    name: timezone · ${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Day bucketing is local-time based, so it has to hold on both sides of
        # UTC, at a half-hour offset, and across a DST boundary.
        tz: [UTC, Asia/Tokyo, America/Los_Angeles, Australia/Adelaide, Europe/Berlin]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  supply-chain:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Assert there are no runtime dependencies
        shell: bash
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          echo "runtime dependencies: $count"
          if [ "$count" != "0" ]; then
            echo "::error::This project ships with zero runtime dependencies. See AGENTS.md."
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit all dependencies (advisory only)
        run: npm audit || true
