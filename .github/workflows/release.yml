name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  artifacts:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Pinned to a single major so the runtime embedded in the standalone
      # executable is consistent across the three platform builds of a tag.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Build standalone executable
        run: npm run package:sea

      - name: Stage the archive
        shell: bash
        run: |
          set -euo pipefail
          out="agent-session-observer-${{ matrix.label }}"
          mkdir -p "stage/$out"
          # The UI is embedded in the binary, so the archive is the binary plus
          # the documents a user should be able to read before running it.
          cp README.md LICENSE SECURITY.md "stage/$out/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/sea/agent-session-observer.exe "stage/$out/"
          else
            cp build/sea/agent-session-observer "stage/$out/"
            chmod +x "stage/$out/agent-session-observer"
          fi
          cd stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../$out.zip" "$out" >/dev/null
          else
            tar -czf "../$out.tar.gz" "$out"
          fi

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          # macOS ships `shasum`, not `sha256sum`.
          if command -v sha256sum >/dev/null 2>&1; then
            hash() { sha256sum "$1"; }
          else
            hash() { shasum -a 256 "$1"; }
          fi
          for f in agent-session-observer-*.zip agent-session-observer-*.tar.gz; do
            [ -e "$f" ] || continue
            hash "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Smoke test the executable
        shell: bash
        run: |
          set -euo pipefail
          # Copied somewhere with no dist/ beside it: the binary has to be
          # genuinely self-contained, and serve its embedded UI from there.
          mkdir -p smoke
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/sea/agent-session-observer.exe smoke/
            bin="./agent-session-observer.exe"
          else
            cp build/sea/agent-session-observer smoke/
            bin="./agent-session-observer"
          fi
          cd smoke
          "$bin" --version
          "$bin" --doctor
          "$bin" --port 7799 --no-open &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:7799/api/status; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7799/api/status > /dev/null
          html=$(curl -fsS http://127.0.0.1:7799/)
          echo "$html" | grep -q '<div id="root">'
          asset=$(echo "$html" | grep -o 'assets/[^"]*\.js' | head -1)
          test -n "$asset"
          curl -fsS -o /dev/null "http://127.0.0.1:7799/$asset"
          echo "embedded UI served from a standalone binary: OK"
          kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            agent-session-observer-*.zip
            agent-session-observer-*.tar.gz
            agent-session-observer-*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
